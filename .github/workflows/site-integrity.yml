name: Site integrity (offline)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check links, PDF, sitemap and SEO
        run: python3 scripts/check_site.py
      - name: Set up Node for contact-form tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Yandex Forms switch and FAQ placement
        run: node --test scripts/test_yandex_embed.cjs
