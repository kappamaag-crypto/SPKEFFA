<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" role="img" aria-label="ЭФФА — современная огнезащита">
  <title>ЭФФА — современная огнезащита</title>
  <!-- Nested rounded hexagons (mark) — flat-top orientation -->
  <g transform="translate(68,65)" fill="none" stroke="#E87722" stroke-linejoin="round" stroke-linecap="round">
    <!-- outer -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" stroke-width="6.5"/>
    <!-- middle -->
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18" stroke-width="5.5"/>
    <!-- inner -->
    <polygon points="0,-22 19.1,-11 19.1,11 0,22 -19.1,11 -19.1,-11" stroke-width="4.5"/>
  </g>
  <!-- Wordmark -->
  <text x="140" y="62" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#E87722">ЭФФА</text>
  <text x="140" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8A9099" letter-spacing="0.5">современная огнезащита</text>
</svg>
