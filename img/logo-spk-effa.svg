<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="СПК ЭФФА">
  <title>СПК ЭФФА</title>
  <!-- Dual interlocking hexagons -->
  <g transform="translate(140,78)">
    <!-- left hex navy -->
    <g transform="translate(-28,0)">
      <polygon points="0,-42 36.4,-21 36.4,21 0,42 -36.4,21 -36.4,-21" fill="none" stroke="#2C3E6B" stroke-width="5"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="none" stroke="#2C3E6B" stroke-width="4"/>
      <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7" fill="none" stroke="#2C3E6B" stroke-width="3"/>
    </g>
    <!-- right hex orange -->
    <g transform="translate(28,0)">
      <polygon points="0,-42 36.4,-21 36.4,21 0,42 -36.4,21 -36.4,-21" fill="none" stroke="#E87722" stroke-width="5"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="none" stroke="#E87722" stroke-width="4"/>
      <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7" fill="none" stroke="#E87722" stroke-width="3"/>
    </g>
  </g>
  <!-- СПК with lines -->
  <line x1="70" y1="148" x2="105" y2="148" stroke="#2C3E6B" stroke-width="1.5"/>
  <text x="140" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C3E6B" letter-spacing="3">СПК</text>
  <line x1="175" y1="148" x2="210" y2="148" stroke="#2C3E6B" stroke-width="1.5"/>
  <!-- ЭФФА -->
  <text x="140" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#2C3E6B" letter-spacing="2">ЭФФА</text>
</svg>
