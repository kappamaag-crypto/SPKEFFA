<body>
  <header class="header"><div class="container header-inner">
    <a href="/" class="logo">СПК ЭФФА</a><nav class="nav"></nav>
    <a href="tel:+79829059348" class="header-phone">+7 (982) 905-93-48</a>
  </div></header>
  <section class="product-hero"><div class="container">
    <div class="breadcrumb"><a href="/">Главная</a> / Расчёт</div>
    <h1>Заявка на расчёт и коммерческое предложение</h1>
    <p>Укажите направление и параметры объекта — подготовим расход материалов и КП</p>
  </div></section>
  <section class="section"><div class="container" style="max-width:640px;">
    <form class="contact-form" action="https://formspree.io/f/mdaqywrn" method="POST" style="padding:32px;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
      <input type="text" name="name" placeholder="Имя / организация" required>
      <input type="tel" name="phone" placeholder="Телефон" required>
      <input type="email" name="email" placeholder="Email">
      <select name="direction" required style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px;">
        <option value="">Направление</option>
        <option>Blank — антикоррозия</option>
        <option>ЭФФА — огнезащита</option>
        <option>Veksa — наливные полы</option>
        <option>Система АКЗ + ОГЗ</option>
      </select>
      <textarea name="message" placeholder="Категория среды (C3–C5), предел R, площадь или тоннаж, город объекта" rows="5" required></textarea>
      <button type="submit" class="btn btn-primary">Отправить заявку</button>
      <p class="form-note">Нажимая кнопку, вы соглашаетесь на обработку персональных данных</p>
